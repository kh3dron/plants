<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plants: specimen catalog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234d7c0f'/%3E%3Cpath d='M8 13V5M8 9L5 6M8 7l3-3' stroke='%23fdfdfd' stroke-width='1.5' fill='none'/%3E%3C/svg%3E" />
  <style>
    :root {
      /* PRESS RUN: chosen once, never varied */
      --ink: #111;
      --ink-2: #4d7c0f; /* second ink: moss. structure + navigation only */
      --paper: #fdfdfd;
      --font: "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; /* face: mono */
      --size: 14px;
      --btn-shadow: #bbb;
    }

    * { border-radius: 0; box-shadow: none; box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: var(--size);
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
      background: var(--paper);
      color: var(--ink);
    }

    a { color: var(--ink-2); text-decoration: underline; }
    a:visited { color: var(--ink); }
    :focus-visible { outline: 1px dotted var(--ink-2); outline-offset: 2px; }

    /* shell */
    .topbar {
      position: sticky; top: 0; z-index: 2;
      background: var(--paper);
      border-bottom: 1px solid var(--ink-2);
    }
    .topbar-row {
      max-width: 1320px; margin: 0 auto; padding: 8px 16px;
      display: flex; gap: 12px; white-space: nowrap; overflow: hidden;
    }
    .wordmark { font-weight: bold; }
    .divider { border-left: 1px solid var(--ink); }

    .shell { max-width: 1320px; margin: 0 auto; padding: 16px; display: flex; gap: 24px; align-items: flex-start; }

    nav { flex: 0 0 204px; position: sticky; top: 52px; max-height: calc(100vh - 68px); overflow-y: auto; padding-bottom: 1px; }
    nav a {
      display: block; padding: 2px 8px; margin-bottom: -1px;
      border: 1px solid var(--ink);
      color: var(--ink); text-decoration: none;
    }
    nav a:visited { color: var(--ink); }
    nav a:hover { background: var(--ink); color: var(--paper); }
    nav a:active { transform: translate(2px, 2px); }
    nav a[aria-current] { background: var(--ink-2); color: var(--paper); }
    .nav-group { margin: 12px 0 4px; font-weight: bold; }
    .nav-group:first-child { margin-top: 0; }

    main { flex: 1 1 auto; min-width: 0; max-width: 1040px; }

    h1 { font-size: 20px; margin: 0 0 4px; padding-bottom: 4px; border-bottom: 3px double var(--ink-2); }
    h2 { font-size: 14px; margin: 16px 0 8px; padding-bottom: 2px; border-bottom: 1px solid var(--ink-2); }
    h1 .sec { color: var(--ink-2); }
    p { margin: 8px 0; max-width: 80ch; }
    .sub { margin-top: 4px; font-weight: bold; }
    .crumb { margin-top: 0; }

    /* plates */
    .plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 12px; }
    .plate-link { display: block; color: var(--ink); text-decoration: none; }
    .plate-link:visited { color: var(--ink); }
    .plate-link canvas { display: block; width: 100%; aspect-ratio: 1; background: var(--ink); border: 1px solid var(--ink); }
    .plate-link:hover .plate-name, .plate-link:focus .plate-name { background: var(--ink); color: var(--paper); }
    .plate-name { display: block; margin-top: 4px; font-weight: bold; text-decoration: underline; }
    .plate-note { display: block; }
    .plate button { margin-top: 6px; }

    /* detail */
    .bench { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; margin-top: 12px; }
    .bench-canvas {
      display: block; width: 100%; aspect-ratio: 4 / 3;
      background: var(--ink); border: 1px solid var(--ink);
      cursor: grab; touch-action: none;
    }
    .bench-panel h2:first-child { margin-top: 0; }
    .bench-panel > div:empty { display: none; }
    .ctrl { display: block; margin-bottom: 10px; }
    .ctrl-head { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .ctrl input[type="range"] { width: 100%; margin: 0; accent-color: var(--ink); }
    input[type="text"] {
      font: inherit; width: 100%; min-width: 0;
      border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
      padding: 2px 8px;
    }
    .rule { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .rule .sym { flex: 0 0 5ch; width: 5ch; text-align: center; }
    .rule button { flex: 0 0 auto; padding: 2px 8px; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    button {
      font: inherit; text-transform: uppercase; letter-spacing: 0.05em;
      cursor: pointer; color: var(--ink); background: var(--paper);
      border: 1px solid var(--ink); padding: 4px 12px;
      box-shadow: 2px 2px var(--btn-shadow); user-select: none;
    }
    button:hover, button:focus { background: var(--ink); color: var(--paper); outline: 0; }
    button:focus-visible { outline: 1px dotted var(--ink-2); outline-offset: 2px; }
    button:active { transform: translate(2px, 2px); box-shadow: none; }
    button:disabled { opacity: 0.5; pointer-events: none; }

    table { border-collapse: collapse; margin: 12px 0; }
    th, td { border: 1px solid var(--ink); padding: 2px 8px; text-align: left; white-space: nowrap; }
    th { background: var(--ink-2); color: var(--paper); font-weight: normal; text-transform: uppercase; letter-spacing: 0.05em; }
    td.num { text-align: right; }
    ul { padding-left: 2ch; }

    @media (max-width: 800px) {
      .shell { flex-direction: column; }
      nav { position: static; flex: none; width: 100%; max-height: none; }
      .bench { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-row">
      <span class="wordmark">The algorithmic beauty of plants</span>
      <span class="divider"></span>
      <span>Specimen catalog</span>
    </div>
  </header>

  <div class="shell">
    <nav id="nav" aria-label="Halls"></nav>
    <main id="content">
      <noscript>This catalog requires JavaScript and WebGL.</noscript>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./museum/gallery.js"></script>
</body>

</html>
